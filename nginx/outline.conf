# ====================================================================
# nginx reverse proxy para Outline (produccion)
# Copiar a /etc/nginx/sites-available/outline.conf y enlazar a sites-enabled
# Cambiar wiki.tudominio.com por tu dominio real.
# ====================================================================

# HTTP -> redirige a HTTPS (y sirve el challenge de certbot)
server {
    listen 80;
    listen [::]:80;
    server_name wiki.tudominio.com;

    # Let's Encrypt webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wiki.tudominio.com;

    # --- TLS (certbot / Let's Encrypt) ---
    ssl_certificate     /etc/letsencrypt/live/wiki.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wiki.tudominio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # --- Subida de videos pesados (igualar a FILE_STORAGE_UPLOAD_MAX_SIZE) ---
    client_max_body_size 5120M;           # 5 GB
    proxy_request_buffering off;          # streamear upload al backend, no a disco de nginx
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # --- Websockets (realtime / colaboracion en vivo) ---
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # --- Headers para que Outline sepa el host/proto real ---
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_redirect off;
    }
}
