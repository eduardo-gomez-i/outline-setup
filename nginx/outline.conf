# ====================================================================
# nginx reverse proxy para Outline (produccion - ferremobil)
# Copiar a /etc/nginx/sites-available/outline.conf y enlazar a sites-enabled
# ====================================================================

server {
    listen 443 ssl http2;
    server_name wiki.ferremobil.com;

    # --- TLS (certificado propio) ---
    ssl_certificate     /etc/ssl/ferremobil.combined.crt;
    ssl_certificate_key /etc/ssl/private/priv.key;

    # --- Subida de videos pesados (igualar a FILE_STORAGE_UPLOAD_MAX_SIZE) ---
    client_max_body_size 5120M;           # 5 GB
    proxy_request_buffering off;          # streamear upload al backend
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;

        # --- Websockets (realtime / colaboracion en vivo) ---
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # --- Headers host/proto real ---
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name wiki.ferremobil.com;
    return 301 https://$host$request_uri;
}
